name: Bot paper trading

on:
  schedule:
    - cron: "15 17 * * 1-5"   # dal lunedì al venerdì, dopo la chiusura di Borsa Italiana
  workflow_dispatch:

permissions:
  contents: write

concurrency: paper-trading

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Test
        run: python -m pytest -q tests
      - name: Giro giornaliero
        run: python -m bot.run
      - name: Salva stato e diario
        run: |
          git config user.name "trading-lab bot"
          git config user.email "actions@users.noreply.github.com"
          git add state journal STATO.md
          git diff --cached --quiet || git commit -m "Diario $(date -u +%Y-%m-%d)"
          git push
